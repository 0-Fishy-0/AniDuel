<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniDuel</title>
    <!--  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
    <!--  -->
    <link rel="stylesheet" href="./Styles/mainMenu.css">
</head>
<body>
    <div class="container">
        <div class="left-half col">
            <div class="left-text">
                <span>Welcome To</span>
                <span id="AniDuel">AniDuel</span>
                <span><-- card battle --></span>
            </div>
        </div>
        <div class="separator-vert">
        </div>
        <div class="right-half col">
            <button id="btn-1v1">
                <span class="btn-text">1v1</span>
                <span class="btn-desc">Classic 1v1</span>
            </button>
            <button id="btn-2v2" disabled>
                <span class="btn-text">2v2</span>
                <span class="btn-desc">Comming Soon</span>
            </button>
            <button id="btn-3v3" disabled>
                <span class="btn-text">3v3</span>
                <span class="btn-desc">Comming Soon</span>
            </button>
        </div>
    </div>
    <div class="page-leave-anim hidden"></div>
    <script src="./Scripts/mainMenu.js"></script>
</body>
</html>
